<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Simples</title>
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>
    <section class="sec-form">
        <h2 style="margin-bottom: 30px; font-weight: bolder; font-size: 32px;">Acesse sua conta</h2>

        <form id="formCadastro">

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Ex: vitor@mail.com"><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required placeholder="Ex: Senha123@"><br><br>

            <button type="submit">Login</button>
        </form>
        <p><a href="../index.html">Cadastre-se</a></p>
        <p id="mensagem"></p>

    </section>
    <script src="../js/login.js"></script>
</body>

</html>
