<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Simples</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <section class="sec-form">
        <form id="formCadastro">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required placeholder="Ex: Vitor Reis"><br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required placeholder="Ex: vitor@mail.com"><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required placeholder="Ex: Senha123@"><br><br>

        <button type="submit">Enviar</button>
    </form>
    <p><a href="./pages/login.html">Acesse o seu login</a></p>
    <p id="mensagem"></p>
    </section>
    <script src="js/index.js"></script>
</body>
</html>
